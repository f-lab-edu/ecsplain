name: RAG CI 

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]

jobs:
  rag-ci:
    runs-on: ubuntu-latest

    env:
      COMMERICAL_MODEL_OPENAI_API_KEY: ${{ secrets.COMMERICAL_MODEL_OPENAI_API_KEY }}
      COMMERICAL_MODEL_OPENAI_BASE_URL: ${{ secrets.COMMERICAL_MODEL_OPENAI_BASE_URL }}
      COMMERICAL_MODEL_NAME: ${{ secrets.COMMERICAL_MODEL_NAME }}
      TEMPERATURE: ${{ secrets.TEMPERATURE }}

      RAG_API_OPENAI_API_KEY: ${{ secrets.RAG_API_OPENAI_API_KEY }}
      RAG_API_OPENAI_BASE_URL: ${{ secrets.RAG_API_OPENAI_BASE_URL }}
      RAG_API_OPENAI_MODEL: ${{ secrets.RAG_API_OPENAI_MODEL }}
      RAG_API_EMBEDDING_MODEL: ${{ secrets.RAG_API_EMBEDDING_MODEL }}
      RAG_API_RETRIEVAL_K: ${{ secrets.RAG_API_RETRIEVAL_K }}
      RAG_API_TEMPERATURE: ${{ secrets.RAG_API_TEMPERATURE }}
      RAG_API_REASONING_EFFORT: ${{ secrets.RAG_API_REASONING_EFFORT }}
      RAG_API_CHROMA_DIR: ${{ secrets.RAG_API_CHROMA_DIR }}
      RAG_API_DATA_DIR: ${{ secrets.RAG_API_DATA_DIR }}
      RAG_API_OUTPUT_PARSER: ${{ secrets.RAG_API_OUTPUT_PARSER }}

      AWS_CONN_ACCESS_KEY_ID: ${{ secrets.AWS_CONN_ACCESS_KEY_ID }}
      AWS_CONN_SECRET_ACCESS_KEY: ${{ secrets.AWS_CONN_SECRET_ACCESS_KEY }}
      AWS_CONN_DEFAULT_REGION: ${{ secrets.AWS_CONN_DEFAULT_REGION }}

      AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
      AWS_S3_RETRIEVAL_PREFIX: ${{ secrets.AWS_S3_RETRIEVAL_PREFIX }}
      AWS_S3_EXT: ${{ secrets.AWS_S3_EXT }}
      AWS_S3_CONTENT_TYPE: ${{ secrets.AWS_S3_CONTENT_TYPE }}

      RAG_TASK__STORAGE_TYPE: ${{ secrets.RAG_TASK__STORAGE_TYPE }}

      RAG_TASK__DATASET_CONFIG__NAME: ${{ secrets.RAG_TASK__DATASET_CONFIG__NAME }}
      RAG_TASK__DATASET_CONFIG__ID: ${{ secrets.RAG_TASK__DATASET_CONFIG__ID }}
      RAG_TASK__DATASET_CONFIG__VERSION: ${{ secrets.RAG_TASK__DATASET_CONFIG__VERSION }}
      RAG_TASK__DATASET_CONFIG__PATH: ${{ secrets.RAG_TASK__DATASET_CONFIG__PATH }}
      RAG_TASK__DATASET_CONFIG__MANIFEST_PATH: ${{ secrets.RAG_TASK__DATASET_CONFIG__MANIFEST_PATH }}

      RAG_TASK__RETRIEVAL_POOL_CONFIG__DATASET_CONFIG__NAME: ${{ secrets.RAG_TASK__RETRIEVAL_POOL_CONFIG__DATASET_CONFIG__NAME }}
      RAG_TASK__RETRIEVAL_POOL_CONFIG__DATASET_CONFIG__ID: ${{ secrets.RAG_TASK__RETRIEVAL_POOL_CONFIG__DATASET_CONFIG__ID }}
      RAG_TASK__RETRIEVAL_POOL_CONFIG__DATASET_CONFIG__VERSION: ${{ secrets.RAG_TASK__RETRIEVAL_POOL_CONFIG__DATASET_CONFIG__VERSION }}
      RAG_TASK__RETRIEVAL_POOL_CONFIG__DATASET_CONFIG__PATH: ${{ secrets.RAG_TASK__RETRIEVAL_POOL_CONFIG__DATASET_CONFIG__PATH }}
      RAG_TASK__RETRIEVAL_POOL_CONFIG__DATASET_CONFIG__MANIFEST_PATH: ${{ secrets.RAG_TASK__RETRIEVAL_POOL_CONFIG__DATASET_CONFIG__MANIFEST_PATH }}

      RAG_TASK__RETRIEVAL_POOL_CONFIG__SAMPLE_TYPE: ${{ secrets.RAG_TASK__RETRIEVAL_POOL_CONFIG__SAMPLE_TYPE }}

      RAG_TASK__RETRIEVAL_POOL_CONFIG__VECTORSTORE__TYPE: ${{ secrets.RAG_TASK__RETRIEVAL_POOL_CONFIG__VECTORSTORE__TYPE }}
      RAG_TASK__RETRIEVAL_POOL_CONFIG__VECTORSTORE__PERSIST_DIR: ${{ secrets.RAG_TASK__RETRIEVAL_POOL_CONFIG__VECTORSTORE__PERSIST_DIR }}
      RAG_TASK__RETRIEVAL_POOL_CONFIG__VECTORSTORE__COLLECTION: ${{ secrets.RAG_TASK__RETRIEVAL_POOL_CONFIG__VECTORSTORE__COLLECTION }}

      RAG_TASK__RETRIEVAL_MODEL_CONFIG__IMPL__KIND: ${{ secrets.RAG_TASK__RETRIEVAL_MODEL_CONFIG__IMPL__KIND }}
      RAG_TASK__RETRIEVAL_MODEL_CONFIG__IMPL__PROVIDER: ${{ secrets.RAG_TASK__RETRIEVAL_MODEL_CONFIG__IMPL__PROVIDER }}
      RAG_TASK__RETRIEVAL_MODEL_CONFIG__IMPL__NAME: ${{ secrets.RAG_TASK__RETRIEVAL_MODEL_CONFIG__IMPL__NAME }}
      RAG_TASK__RETRIEVAL_MODEL_CONFIG__IMPL__API_KEY: ${{ secrets.RAG_TASK__RETRIEVAL_MODEL_CONFIG__IMPL__API_KEY }}
      RAG_TASK__RETRIEVAL_MODEL_CONFIG__IMPL__BASE_URL: ${{ secrets.RAG_TASK__RETRIEVAL_MODEL_CONFIG__IMPL__BASE_URL }}

      RAG_TASK__RETRIEVAL_MODEL_CONFIG__RUNTIME__TOP_K: ${{ secrets.RAG_TASK__RETRIEVAL_MODEL_CONFIG__RUNTIME__TOP_K }}
      RAG_TASK__RETRIEVAL_MODEL_CONFIG__RUNTIME__SCORE_THRESHOLD: ${{ secrets.RAG_TASK__RETRIEVAL_MODEL_CONFIG__RUNTIME__SCORE_THRESHOLD }}
      RAG_TASK__RETRIEVAL_MODEL_CONFIG__RUNTIME__SEARCH_TYPE: ${{ secrets.RAG_TASK__RETRIEVAL_MODEL_CONFIG__RUNTIME__SEARCH_TYPE }}

      RAG_TASK__GENERATION_MODEL_CONFIG__IMPL__KIND: ${{ secrets.RAG_TASK__GENERATION_MODEL_CONFIG__IMPL__KIND }}
      RAG_TASK__GENERATION_MODEL_CONFIG__IMPL__PROVIDER: ${{ secrets.RAG_TASK__GENERATION_MODEL_CONFIG__IMPL__PROVIDER }}
      RAG_TASK__GENERATION_MODEL_CONFIG__IMPL__NAME: ${{ secrets.RAG_TASK__GENERATION_MODEL_CONFIG__IMPL__NAME }}
      RAG_TASK__GENERATION_MODEL_CONFIG__IMPL__COMMENT: ${{ secrets.RAG_TASK__GENERATION_MODEL_CONFIG__IMPL__COMMENT }}
      RAG_TASK__GENERATION_MODEL_CONFIG__IMPL__API_KEY: ${{ secrets.RAG_TASK__GENERATION_MODEL_CONFIG__IMPL__API_KEY }}

      RAG_TASK__GENERATION_MODEL_CONFIG__RUNTIME__TEMPERATURE: ${{ secrets.RAG_TASK__GENERATION_MODEL_CONFIG__RUNTIME__TEMPERATURE }}
      RAG_TASK__GENERATION_MODEL_CONFIG__RUNTIME__TOP_P: ${{ secrets.RAG_TASK__GENERATION_MODEL_CONFIG__RUNTIME__TOP_P }}
      RAG_TASK__GENERATION_MODEL_CONFIG__RUNTIME__MAX_TOKENS: ${{ secrets.RAG_TASK__GENERATION_MODEL_CONFIG__RUNTIME__MAX_TOKENS }}
      RAG_TASK__GENERATION_MODEL_CONFIG__RUNTIME__STOP: ${{ secrets.RAG_TASK__GENERATION_MODEL_CONFIG__RUNTIME__STOP }}
      RAG_TASK__GENERATION_MODEL_CONFIG__RUNTIME__REASONING_EFFORT: ${{ secrets.RAG_TASK__GENERATION_MODEL_CONFIG__RUNTIME__REASONING_EFFORT }}
      RAG_TASK__GENERATION_MODEL_CONFIG__RUNTIME__PROMPT_PATH: ${{ secrets.RAG_TASK__GENERATION_MODEL_CONFIG__RUNTIME__PROMPT_PATH }}

      EVAL_ENGINE_STRICT: ${{ secrets.EVAL_ENGINE_STRICT }}
      EVAL_ENGINE__EVALUATORS: ${{ secrets.EVAL_ENGINE__EVALUATORS }}
      EVAL_ENGINE__REPORTERS: ${{ secrets.EVAL_ENGINE__REPORTERS }}

      EVAL_ENGINE__META_INFO__TITLE: ${{ secrets.EVAL_ENGINE__META_INFO__TITLE }}
      EVAL_ENGINE__META_INFO__ID: ${{ secrets.EVAL_ENGINE__META_INFO__ID }}
      EVAL_ENGINE__META_INFO__GOAL: ${{ secrets.EVAL_ENGINE__META_INFO__GOAL }}
      EVAL_ENGINE__META_INFO__HYPOTHESIS: ${{ secrets.EVAL_ENGINE__META_INFO__HYPOTHESIS }}
      EVAL_ENGINE__META_INFO__NOTES: ${{ secrets.EVAL_ENGINE__META_INFO__NOTES }}
      EVAL_ENGINE__META_INFO_GIT_COMMIT_HASH: ${{ secrets.EVAL_ENGINE__META_INFO_GIT_COMMIT_HASH }}


      BASE_BRANCH: ${{ github.base_ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies 
        run: |
          pip install --upgrade pip 
          pip install -r requirements.txt 
      
      - name: Get changed Python files
        id: changed-files
        run: |
          # BASE_BRANCH (예: develop, main) 를 로컬 브랜치로 가져오기
          git fetch origin "$BASE_BRANCH":"$BASE_BRANCH"

          # BASE_BRANCH vs HEAD 사이 변경된 .py 파일 (삭제 제외)
          CHANGED_FILES=$(git diff --name-only --diff-filter=ACMR "$BASE_BRANCH"..HEAD -- '*.py')

          echo "Changed files:"
          echo "$CHANGED_FILES"

          # output 으로 넘기기 (개행 포함)
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED_FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # 🧹 변경된 파일이 있을 때만 ruff 실행

      # 🧹 변경된 파일이 있을 때만 ruff 실행
      - name: Run ruff on changed files
        if: steps.changed-files.outputs.files != ''
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.files }}
        run: |
          echo "CHANGED_FILES:"
          printf '%s\n' "$CHANGED_FILES"
          echo
          echo "$CHANGED_FILES" | xargs -r ruff check

      - name: Run mypy on changed files
        if: steps.changed-files.outputs.files != ''
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.files }}
        run: |
          echo "CHANGED_FILES:"
          printf '%s\n' "$CHANGED_FILES"
          echo
          echo "$CHANGED_FILES" | xargs -r mypy --config-file mypy.ini

      - name: Install AWS CLI v2.32.11
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64-2.32.11.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          sudo ./aws/install --update

      - name: Download test data 
        run: |
          mkdir -p tests/data
          mkdir -p tests/data/chroma_dir
          aws s3 cp s3://ecsplainer-crawl-bucket/github_test/ tests/data --recursive
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-northeast-2
      
      - name: Run retriever sanity tests 
        env:
          PYTHONPATH: ${{ github.workspace }} 
        run: python3 -m pytest tests/test_retriever_sanity.py

      - name: Run RAG E2E tests 
        env:
          PYTHONPATH: ${{ github.workspace }} 
        run: python3 -m pytest tests/test_rag_e2e.py

      - name: RUN LLM eval tests
        env: 
          PYTHONPATH: ${{ github.workspace }} 
        run: python3 -m pytest tests/test_llm_eval.py
